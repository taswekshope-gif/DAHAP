<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DAHAP</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;700&display=swap" rel="stylesheet">

<style>
html {
  scroll-behavior: smooth;
}

body {
    margin:0;
    font-family: 'Cairo', sans-serif;
    background:#fff;
}

/* HERO */
.hero {
    text-align:center;
    padding:40px 20px;
}

.hero img {
    width:100%;
    max-height:300px;
    object-fit:cover;
    border-radius:10px;
}

h1 { color:#D4AF37; }

/* زر */
.btn {
    background:#0F7B65;
    color:#fff;
    padding:15px 25px;
    border-radius:8px;
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
}

/* Gallery */
.gallery {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.gallery img {
    width:100%;
    border-radius:10px;
}

/* Timer */
.timer {
    font-size:28px;
    font-weight:bold;
    color:#D4AF37;
}

/* Form */
form {
    max-width:400px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input, select, button {
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
}

button {
    background:#0F7B65;
    color:#fff;
    border:none;
    cursor:pointer;
}

button:hover {
    background:#095c4d;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <img src="images/header.jpg">

    <h1>DAHAP</h1>
    <h2>سلسلة باسمك بتصميم مميز</h2>

    <a class="btn" href="#order">اطلبي الآن</a>
</section>

<!-- صور -->
<section>
    <div class="gallery">
        <img src="images/1.jpg">
        <img src="images/2.jpg">
        <img src="images/3.jpg">
        <img src="images/4.jpg">
        <img src="images/5.jpg">
    </div>
</section>

<!-- عرض -->
<section>
    <h2>العرض بينتهي خلال</h2>
    <div class="timer" id="countdown"></div>
</section>

<!-- فورم -->
<section id="order">
<form id="orderForm">

<input type="text" id="customerName" placeholder="اسمك" required>
<input type="tel" id="phone" placeholder="رقم التليفون" required>

<select id="governorate" required>
<option value="">اختار المحافظة</option>
<option>القاهرة</option>
<option>الجيزة</option>
<option>الإسكندرية</option>
</select>

<select id="city" required>
<option value="">اختار المدينة</option>
</select>

<input type="text" id="address" placeholder="العنوان بالكامل" required>

<select id="design">
<option>عادي</option>
<option>قلب ❤️</option>
<option>فراشة 🦋</option>
<option>تاج 👑</option>
<option>مزدوج</option>
</select>

<select id="font">
<option>عربي</option>
<option>إنجليزي</option>
</select>

<input type="text" id="chainName" placeholder="الاسم على السلسلة" required>

<button type="submit">تأكيد الطلب</button>

</form>
</section>

<script>
// المحافظات والمراكز
const cities = {
  "القاهرة": ["مدينة نصر","مصر الجديدة","المعادي"],
  "الجيزة": ["الهرم","فيصل","المهندسين"],
  "الإسكندرية": ["سموحة","العجمي","سيدي جابر"]
};

document.getElementById("governorate").addEventListener("change", function(){
  let citySelect = document.getElementById("city");
  citySelect.innerHTML = "<option>اختار المدينة</option>";

  cities[this.value].forEach(function(c){
    let option = document.createElement("option");
    option.text = c;
    citySelect.add(option);
  });
});


// تايمر احترافي
var end = new Date().getTime() + (24 * 60 * 60 * 1000);

setInterval(function(){
  var now = new Date().getTime();
  var t = end - now;

  var h = Math.floor((t/(1000*60*60)));
  var m = Math.floor((t%(1000*60*60))/(1000*60));
  var s = Math.floor((t%(1000*60))/1000);

  document.getElementById("countdown").innerHTML =
  h + " ساعة : " + m + " دقيقة : " + s + " ثانية";
},1000);


// فورم
document.getElementById("orderForm").addEventListener("submit", function(e){
e.preventDefault();

let name = customerName.value;
let phone = phone.value;
let gov = governorate.value;
let city = city.value;
let address = address.value;
let design = design.value;
let font = font.value;
let chain = chainName.value;

let message = `طلب جديد
الاسم: ${name}
رقم الهاتف: ${phone}
العنوان: ${gov} - ${city} - ${address}
الاسم على السلسلة: ${chain}
التصميم: ${design}
الكتابة: ${font}`;

let url = "https://wa.me/201106018685?text=" + encodeURIComponent(message);

window.open(url);
});
</script>

</body>
</html>
