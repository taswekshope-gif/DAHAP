<!-- Countdown Script -->
<script>
var countDownDate = new Date().getTime() + (2 * 60 * 60 * 1000);

var timerInterval = setInterval(function() {
  var now = new Date().getTime();
  var distance = countDownDate - now;

  if(distance < 0){
    clearInterval(timerInterval);
    document.getElementById("countdown").innerHTML = "انتهى العرض";
    return;
  }

  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

  document.getElementById("countdown").innerHTML = hours + "h " + minutes + "m ";
}, 1000);
</script>

<!-- Order Form Script -->
<script>
document.getElementById("orderForm").addEventListener("submit", function(e){
    e.preventDefault();

    var name = document.getElementById("name").value;
    var address = document.getElementById("address").value;
    var phone = document.getElementById("phone").value;
    var design = document.getElementById("design").value;
    var font = document.getElementById("font").value;

    // التحقق من رقم الهاتف المصري
    var phonePattern = /^01[0-9]{9}$/;
    if(!phonePattern.test(phone)) { 
        alert("أدخل رقم هاتف مصري صالح");
        return; 
    }

    // توليد كود الطلب
    var today = new Date();
    var orderID = today.getFullYear().toString().slice(-2) + 
                  (today.getMonth()+1).toString().padStart(2,'0') + 
                  today.getDate().toString().padStart(2,'0') + 
                  Math.floor(Math.random()*900+100); // 3 أرقام عشوائية

    // إرسال البيانات إلى Google Sheet
   fetch("https://script.google.com/macros/s/AKfycbwDZjxJEWSJoJx3Ey2iKhhgi19JRPVDZ1Hz7KtS9pxAtEBh1ptxfiM5KVBngF9uljuy2w/exec", {
        method: "POST",
        body: JSON.stringify({name, address, phone, design, font}),
        headers: {'Content-Type':'application/json'}
    })
    .then(res => res.json())
    .then(data => {
        // فتح واتساب برسالة الطلب
        var message = "طلب جديد من DAHAP%0A"
                    + "كود الطلب: " + orderID + "%0A"
                    + "--------------------%0A"
                    + "الاسم: " + name + "%0A"
                    + "العنوان: " + address + "%0A"
                    + "رقم الهاتف: " + phone + "%0A"
                    + "نوع التصميم: " + design + "%0A"
                    + "نوع الكتابة: " + font;

        window.open("https://wa.me/201106018685?text=" + message, "_blank");
    })
    .catch(err => {
        alert("حدث خطأ، حاول مرة أخرى");
        console.error(err);
    });
});
</script>
