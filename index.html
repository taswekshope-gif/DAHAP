<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلسلة باسمك - DAHAP</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;700&display=swap" rel="stylesheet">
<style>
body { margin:0; font-family: 'Cairo', sans-serif; background:#fff; color:#111; }
html { scroll-behavior: smooth; }
.container { padding:20px; text-align:center; max-width:900px; margin:auto; }
.hero { background: url('images/header.jpg') center/cover no-repeat; min-height: 90vh; color:#fff; padding:80px 20px; position:relative; display:flex; flex-direction:column; justify-content:center; align-items:center; border-radius:10px; }
.hero::before { content:''; position:absolute; width:100%; height:100%; background:rgba(0,0,0,0.5); top:0; left:0; border-radius:10px; }
.hero * { position:relative; }
.hero h1 { color:#D4AF37; font-size:3rem; margin-bottom:10px; }
.hero h2 { font-size:2rem; margin-bottom:10px; }
.btn { background:#0F7B65; color:#fff; padding:15px 25px; border-radius:8px; display:inline-block; margin-top:20px; text-decoration:none; font-weight:bold; }
.btn:hover { background:#095c4d; }
.gallery { display:flex; overflow-x:auto; gap:15px; padding:10px; }
.item { min-width:160px; text-align:center; }
.item img { width:100%; border-radius:10px; transition:0.3s; }
.item img:hover { transform:scale(1.05); }
.item span { display:block; margin-top:8px; font-weight:bold; }
.offer { background:#F5F5F5; padding:40px; border-radius:15px; margin-top:20px; }
.offer del { color:#888; margin-right:10px; }
.timer { font-size:28px; font-weight:bold; color:#D4AF37; margin-top:15px; }
form { max-width:400px; margin:auto; display:flex; flex-direction:column; gap:10px; }
input, select, button { padding:12px; border-radius:8px; border:1px solid #ccc; }
button { background:#0F7B65; color:#fff; border:none; cursor:pointer; font-weight:bold; }
button:hover { background:#095c4d; }
.note { font-size:14px; color:#555; }
#successMessage { display:none; background:#0F7B65; color:#fff; padding:20px; border-radius:10px; margin-top:20px; }
</style>
</head>
<body>

<section class="hero">
<img src="images/logo.png" style="width:120px; margin-bottom:15px;">
<h1>DAHAP</h1>
<h2>سلسلة باسمك بتصميم مميز</h2>
<p>قطعة أنيقة مصممة باسمك أو اسم تحبيه</p>
<a class="btn" href="#order">اطلبي الآن</a>
</section>

<section class="container">
<h2>أشكال من شغلنا</h2>
<div class="gallery">
  <div class="item"><img src="images/1.jpg"><span>عادي</span></div>
  <div class="item"><img src="images/2.jpg"><span>قلب ❤️</span></div>
  <div class="item"><img src="images/3.jpg"><span>فراشة 🦋</span></div>
  <div class="item"><img src="images/4.jpg"><span>تاج 👑</span></div>
  <div class="item"><img src="images/5.jpg"><span>مزدوج</span></div>
</div>
</section>

<section class="container">
<h2>ليه تختارينا؟</h2>
<p>✔ تصميم مخصوص – ✔ جودة عالية – ✔ هدية مثالية</p>
</section>

<section class="offer">
<h2>عرض خاص</h2>
<p><del>349 جنيه</del> <strong>249 جنيه</strong></p>
<div class="timer" id="countdown"></div>
</section>

<section id="order" class="container">
<h2>اطلبي سلسلتك الآن</h2>
<form id="orderForm">
<input type="text" id="customerName" placeholder="اسمك" required>
<input type="tel" id="phone" placeholder="رقم التليفون" required>

<select id="governorate" required>
  <option value="">اختاري المحافظة</option>
</select>

<select id="city" required>
  <option value="">اختار المدينة</option>
</select>

<input type="text" id="address" placeholder="اسم الشارع ورقم العمارة والدور + علامة مميزة" required>
<select id="design"><option selected>عادي</option><option>قلب ❤️</option><option>فراشة 🦋</option><option>تاج 👑</option><option>مزدوج</option></select>
<select id="font"><option selected>عربي</option><option>إنجليزي</option></select>
<input type="text" id="chainName" placeholder="الاسم المطلوب على السلسلة" required>
<p class="note">⚠️ بعد ملء البيانات سيتم تحويلك لواتساب لتأكيد الطلب</p>
<button type="submit">تأكيد الطلب</button>
</form>
<div id="successMessage"></div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function(){

// ✅ تايمر 3 ساعات
let duration = 3 * 60 * 60;
setInterval(()=>{
let h = Math.floor(duration/3600);
let m = Math.floor((duration%3600)/60);
let s = duration%60;

document.getElementById("h").innerText = String(h).padStart(2,'0');
document.getElementById("m").innerText = String(m).padStart(2,'0');
document.getElementById("s").innerText = String(s).padStart(2,'0');

if(duration>0) duration--;
},1000);
  
// المحافظات والمدن
const govData = {
"القاهرة":["الشرابية","الزمالك","النزهة","المعادي","مصر الجديدة","15 مايو","العمرانية","البساتين","أحياء أخرى"],
"الجيزة":["الهرم","فيصل","المهندسين","6 أكتوبر","الشيخ زايد","البدرشين","الصف","العياط","أوسيم","كرداسة"],
"الإسكندرية":["سموحة","سيدي جابر","العجمي","محرم بك","المنتزه"],
"الدقهلية":["المنصورة","ميت غمر","طلخا","دكرنس","بلقاس","السنبلاوين","جمصة"],
"البحيرة":["دمنهور","كفر الدوار","إدكو","أبو حمص","الدلنجات","حوش عيسى","الرحمانية","المحمودية"],
"الشرقية":["الزقازيق","العاشر من رمضان","بلبيس","فاقوس","مشتول السوق"],
"القليوبية":["بنها","شبرا الخيمة","القناطر الخيرية","الخانكة","كفر شكر","طوخ","شبين القناطر"],
"المنوفية":["شبين الكوم","منوف","أشمون","تلا","بركة السبع"],
"الغربية":["طنطا","المحلة الكبرى","كفر الزيات","زفتى","سمنود"],
"كفر الشيخ":["كفر الشيخ","دسوق","برج البرلس","مصيف بلطيم"],
"دمياط":["دمياط","دمياط الجديدة","رأس البر"],
"بورسعيد":["بورسعيد","بورفؤاد","العربية"],
"الإسماعيلية":["الإسماعيلية","فايد","القنطرة شرق","القنطرة غرب"],
"السويس":["السويس","العين السخنة","جبل قاسم"],
"بني سويف":["بني سويف","ناصر","ببا","الواسطى"],
"الفيوم":["الفيوم","سنورس","إطسا","طامية"],
"المنيا":["المنيا","العدوة","بني مزار","مطاي","مغاغة"],
"أسيوط":["أسيوط","ديروط","أبوتيج","القوصية"],
"سوهاج":["سوهاج","جرجا","أخميم","طهطا","ساقلتة"],
"قنا":["قنا","نجع حمادي","قفط","دشنا","الأقصير"],
"الأقصر":["الأقصر","إسنا","أرمنت","البياضية","الزينية"],
"أسوان":["أسوان","كوم أمبو","نصر النوبة","الدبورية","أبو سمبل"],
"البحر الأحمر":["الغردقة","سفاجا","رأس غارب","القصير","مرسى علم"],
"الوادي الجديد":["الخارجة","باريس","الفرافرة","موط"],
"مطروح":["مرسى مطروح","الحمام","الضبعة","النجيلة"],
"شمال سيناء":["العريش","رفح","شيخ زويد","بئر العبد"],
"جنوب سيناء":["دهب","شرم الشيخ","نويبع","طابا","سانت كاترين"]
};

let govSelect = document.getElementById("governorate");
let citySelect = document.getElementById("city");

Object.keys(govData).forEach(g=>{
let opt=document.createElement("option");
opt.value=g;
opt.text=g;
govSelect.appendChild(opt);
});

govSelect.addEventListener("change",()=>{
citySelect.innerHTML='<option>المدينة</option>';
govData[govSelect.value].forEach(c=>{
let opt=document.createElement("option");
opt.value=c;
opt.text=c;
citySelect.appendChild(opt);
});
});

// Form Submission
document.getElementById("orderForm").addEventListener("submit", function(e){
    e.preventDefault();
    let customerName = document.getElementById("customerName").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let gov = document.getElementById("governorate").value;
    let city = document.getElementById("city").value;
    let address = document.getElementById("address").value.trim();
    let design = document.getElementById("design").value;
    let font = document.getElementById("font").value;
    let chainName = document.getElementById("chainName").value.trim();

    if(!/^01[0-9]{9}$/.test(phone)){ alert("أدخل رقم هاتف مصري صالح"); return; }

    let btn = document.querySelector("#orderForm button"); btn.innerHTML = "جاري الإرسال..."; btn.disabled = true;
    let timestamp = new Date().toLocaleString('ar-EG');

fetch("https://script.google.com/macros/s/AKfycbyDOUmOn8NDTk7ngEg9Kj-o8p3OEK_6A1fxup7LxrBGj_kOaaepd64j8eAqx6XHm8PwTg/exec", {
    method:"POST",
    body: JSON.stringify({customerName, phone, governorate: gov, city, address, design, font, chainName, timestamp}),
    headers:{'Content-Type':'application/json'}
})
.then(res => res.text())
.then(text => {
    let data;
    try {
        data = JSON.parse(text);
    } catch(e) {
        console.log("Response:", text);
        throw new Error("Invalid JSON");
    }

    let orderID = data.orderID || "????";

    document.getElementById("orderForm").style.display="none";
    document.getElementById("successMessage").style.display="block";
    document.getElementById("successMessage").innerHTML = `✅ تم إرسال طلبك بنجاح! رقم الطلب: ${orderID}`;

    let message = `DAHAP
كود الطلب: ${orderID}
--------------------
اسم العميل: ${customerName}
رقم الهاتف: ${phone}
العنوان:
${gov} - ${city}
${address}
الاسم على السلسلة: ${chainName}
التصميم: ${design}
الكتابة: ${font}
الوقت: ${timestamp}`;

    window.open("https://wa.me/201106018685?text=" + encodeURIComponent(message), "_blank");
})
.then(data => {
    // نجاح
    btn.innerHTML = "تم الإرسال ✔";
})
.catch(err => {
    btn.innerHTML = "تأكيد الطلب";
    btn.disabled = false;
});
</script>

</body>
</html>
