<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سلاسل باسمك - DAHAP</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;700&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family: 'Cairo', sans-serif;
    background:#fff;
    color:#111;
}
.container {
    padding:20px;
    text-align:center;
}
.hero {
    background: url('images/header.jpg') center/cover no-repeat;
    color:#fff;
    padding:80px 20px;
    position:relative;
}
.hero::before {
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    top:0;
    left:0;
}
.hero * {
    position:relative;
}
.gallery {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:20px;
}
.gallery img {
    width:100%;
    border-radius:10px;
}
h1 { color:#D4AF37; }

.btn {
    background:#0F7B65;
    color:#fff;
    padding:15px 25px;
    border-radius:8px;
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
}

.offer {
    background:#F5F5F5;
    padding:40px;
}
.timer {
    font-size:24px;
    color:#D4AF37;
}

form {
    max-width:400px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}
input, select, button {
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
}
button {
    background:#0F7B65;
    color:#fff;
    border:none;
}
.note {
    font-size:14px;
    color:#555;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <h1>DAHAP</h1>
    <h2>سلسلة باسمك بتصميم مميز</h2>
    <p>قطعة أنيقة مصممة باسمك أو اسم تحبيه</p>

    <a class="btn" href="#order">اطلبي الآن</a>
</section>

<!-- صور -->
<section class="container">
    <h2>أشكال من شغلنا</h2>
    <div class="gallery">
        <img src="images/1.jpg">
        <img src="images/2.jpg">
        <img src="images/3.jpg">
        <img src="images/4.jpg">
    </div>
</section>

<!-- مميزات -->
<section class="container">
    <h2>ليه تختارينا؟</h2>
    <p>✔ تصميم مخصص – ✔ جودة عالية – ✔ هدية مثالية</p>
</section>

<!-- عرض -->
<section class="offer">
    <h2>عرض خاص</h2>
    <p><del>350 جنيه</del> <strong>199 جنيه</strong></p>
    <div class="timer" id="countdown"></div>
</section>

<!-- فورم -->
<section id="order" class="container">
    <h2>اطلبي سلسلتك الآن</h2>

    <form id="orderForm">

        <input type="text" id="customerName" placeholder="اسمك" required>
        <input type="tel" id="phone" placeholder="رقم التليفون" required>

        <select id="governorate" required>
            <option value="">اختاري المحافظة</option>
            <option>القاهرة</option>
            <option>الجيزة</option>
            <option>الإسكندرية</option>
        </select>

        <input type="text" id="city" placeholder="المنطقة / المركز" required>
        <input type="text" id="street" placeholder="اسم الشارع" required>
        <input type="text" id="landmark" placeholder="علامة مميزة" required>

        <select id="design" required>
            <option value="">نوع التصميم</option>
            <option>عادي</option>
            <option>قلب ❤️</option>
            <option>تاج 👑</option>
        </select>

        <select id="font" required>
            <option value="">نوع الكتابة</option>
            <option>عربي</option>
            <option>إنجليزي</option>
        </select>

        <input type="text" id="chainName" placeholder="الاسم المطلوب على السلسلة" required>

        <p class="note">
        ⚠️ بعد ملء البيانات سيتم تحويلك لواتساب لتأكيد الطلب
        </p>

        <button type="submit">تأكيد الطلب</button>

    </form>
</section>

<!-- Countdown -->
<script>
var countDownDate = new Date();
countDownDate.setHours(23,59,59,999);

setInterval(function() {
  var now = new Date().getTime();
  var distance = countDownDate - now;

  var hours = Math.floor((distance / (1000 * 60 * 60)));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

  document.getElementById("countdown").innerHTML = hours + "h " + minutes + "m ";
}, 1000);
</script>

<!-- Script -->
<script>
document.getElementById("orderForm").addEventListener("submit", function(e){
    e.preventDefault();

    var customerName = document.getElementById("customerName").value;
    var phone = document.getElementById("phone").value;
    var gov = document.getElementById("governorate").value;
    var city = document.getElementById("city").value;
    var street = document.getElementById("street").value;
    var landmark = document.getElementById("landmark").value;
    var design = document.getElementById("design").value;
    var font = document.getElementById("font").value;
    var chainName = document.getElementById("chainName").value;

    var phonePattern = /^01[0-9]{9}$/;
    if(!phonePattern.test(phone)) {
        alert("أدخل رقم هاتف مصري صالح");
        return;
    }

    var today = new Date();
    var orderID = today.getFullYear().toString().slice(-2) +
                  (today.getMonth()+1).toString().padStart(2,'0') +
                  today.getDate().toString().padStart(2,'0') +
                  Math.floor(Math.random()*900+100);

    fetch("https://script.google.com/macros/s/AKfycbwDZjxJEWSJoJx3Ey2iKhhgi19JRPVDZ1Hz7KtS9pxAtEBh1ptxfiM5KVBngF9uljuy2w/exec", {
        method: "POST",
        body: JSON.stringify({customerName, phone, gov, city, street, landmark, design, font, chainName}),
        headers: {'Content-Type':'application/json'}
    });

    var message = `طلب جديد من DAHAP
كود الطلب: ${orderID}
--------------------
اسم العميل: ${customerName}
رقم الهاتف: ${phone}

العنوان:
${gov} - ${city}
${street}
علامة مميزة: ${landmark}

الاسم على السلسلة: ${chainName}
التصميم: ${design}
الكتابة: ${font}`;

    var url = "https://wa.me/201106018685?text=" + encodeURIComponent(message);
    window.open(url, "_blank");
});
</script>

</body>
</html>
