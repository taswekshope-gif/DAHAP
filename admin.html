<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>DAHAP PRO FIX</title>

<style>
body{
  font-family: Cairo, sans-serif;
  background:#f4f6f9;
  padding:20px;
}

.header{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
}

.btn{
  padding:6px 10px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  margin:3px;
  font-size:13px;
}

.whatsapp{background:#25D366;color:#fff;}
.copy{background:#333;color:#fff;}
.ship{background:#0F7B65;color:#fff;}
.doneBtn{background:#1976d2;color:#fff;}

.status{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  color:#fff;
}

.new{background:orange;}
.done{background:green;}
.shipped{background:#1976d2;}

button.main{
  margin:10px 0;
  padding:10px 15px;
  background:#000;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>

</head>

<body>

<h2>📦 DAHAP PRO FIX</h2>

<div class="header">
  <input id="search" placeholder="بحث">
  <input type="date" id="dateFilter">
  <h3 id="count"></h3>
</div>

<button class="main" onclick="printSelected()">🖨️ طباعة المحدد</button>

<div id="orders"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCitT_L8jC3J-z-zPn4ciOao2YJRoIvnsg",
  authDomain: "dahap-87e3a.firebaseapp.com",
  projectId: "dahap-87e3a",
  storageBucket: "dahap-87e3a.firebasestorage.app",
  messagingSenderId: "914606801645",
  appId: "1:914606801645:web:273f6dab0028a42bef02e4",
  measurementId: "G-ZW99YCTSGY"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let orders = [];

// ✅ مهم: تحميل مباشر حتى لو auth فيه مشكلة
load();

onAuthStateChanged(auth, (user)=>{
  if(!user){
    console.log("No user logged in");
  }
});

function load(){
  const q = query(collection(db,"orders"), orderBy("createdAt","desc"));

  onSnapshot(q,(snap)=>{
    orders = snap.docs.map(d=>({id:d.id,...d.data()}));
    console.log("ORDERS:", orders); // 👈 تأكيد الداتا
    render();
  }, (err)=>{
    console.error("Firestore error:", err);
  });
}

function render(){

  let search = document.getElementById("search").value.toLowerCase();
  let date = document.getElementById("dateFilter").value;

  let html = "";
  let count = 0;

  orders.forEach(o=>{

    // ✅ عرض بدون كسر لو مفيش قيم
    let name = (o.customerName || "");
    let phone = (o.phone || "");
    let gov = (o.gov || "");
    let city = (o.city || "");
    let address = (o.address || "");

    // 🔍 فلتر البحث (آمن)
    if(search &&
      !name.toLowerCase().includes(search) &&
      !phone.includes(search)
    ) return;

    // 📅 فلتر التاريخ (آمن)
    let d = o.createdAt?.toDate?.();
    if(date && d){
      let selected = new Date(date).toDateString();
      if(d.toDateString() !== selected) return;
    }

    count++;

    let status = o.status || "new";

    html += `
<div class="card">

<input type="checkbox" class="sel" value='${btoa(JSON.stringify(o))}'>

<b>${o.orderID || "NO-ID"}</b>
<span class="status ${status}">${status}</span><br><br>

${name}<br>
${phone}<br>
${gov} - ${city}<br><br>
${address}<br><br>

<button class="btn whatsapp" onclick="window.open('https://wa.me/${phone}')">واتساب</button>

<button class="btn copy" onclick='copyText(${JSON.stringify(name + " - " + phone)})'>نسخ</button>

<button class="btn ship" onclick="updateStatus('${o.id}','shipped')">شحن</button>

<button class="btn doneBtn" onclick="updateStatus('${o.id}','done')">تم</button>

</div>
`;
  });

  document.getElementById("orders").innerHTML = html || "<p>لا توجد طلبات</p>";
  document.getElementById("count").innerText = "📊 " + count;
}

window.copyText = (t)=>{
  navigator.clipboard.writeText(t);
};

window.updateStatus = async (id,status)=>{
  await updateDoc(doc(db,"orders",id),{status});
};

// 🖨️ طباعة
window.printSelected = ()=>{

  let selected = document.querySelectorAll(".sel:checked");
  if(!selected.length) return alert("اختار أوردرات");

  let win = window.open("");

  let html = `
<html>
<head>
<style>
@page { size: A4; margin: 10mm; }

.page{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box{
  border:1px solid #000;
  padding:10px;
  font-size:12px;
  height:130px;
}
</style>
</head>
<body>

<div class="page">
`;

  selected.forEach(el=>{
    let o = JSON.parse(atob(el.value));

    html += `
<div class="box">
<b>${o.orderID || ""}</b><br>
${o.customerName || ""}<br>
${o.phone || ""}<br>
${o.gov || ""} - ${o.city || ""}<br>
${o.address || ""}
</div>
`;
  });

  html += `
</div>

<script>
window.onload = ()=>window.print();
<\/script>

</body>
</html>
`;

  win.document.write(html);
  win.document.close();
};

</script>

</body>
</html>
