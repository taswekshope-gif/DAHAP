<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>DAHAP Dashboard Pro</title>

<style>
body{
  font-family: Cairo, sans-serif;
  background:#f4f6f9;
  padding:20px;
}

.header{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  transition:0.2s;
}
.card:hover{transform:scale(1.01)}

.btn{
  padding:6px 10px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  margin:3px;
  font-size:13px;
}

.whatsapp{background:#25D366;color:#fff;}
.copy{background:#333;color:#fff;}
.print{background:#ff9800;color:#fff;}
.ship{background:#0F7B65;color:#fff;}
.doneBtn{background:#1976d2;color:#fff;}

.status{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  color:#fff;
}

.new{background:orange;}
.done{background:green;}
.shipped{background:#1976d2;}
</style>

<!-- PDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<h2>📦 DAHAP Dashboard Pro</h2>

<div class="header">
  <input type="text" id="search" placeholder="🔍 بحث">
  <input type="date" id="dateFilter">
  <h3 id="count"></h3>
</div>

<div id="orders"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSy***",
  authDomain: "dahap-87e3a.firebaseapp.com",
  projectId: "dahap-87e3a",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let orders = [];
let lastCount = 0;

// 🔐 login
onAuthStateChanged(auth, (user) => {

  console.log("AUTH USER:", user);

  if (user) {
    load();
  } else {
    setTimeout(() => {
      if (!auth.currentUser) {
        window.location.href = "login.html";
      }
    }, 1500);
  }

});
  
// 📦 load orders
function load(){

  const q = query(collection(db,"orders"), orderBy("createdAt","desc"));

  onSnapshot(q,(snap)=>{

    if(lastCount && snap.size > lastCount){
      notify();
      sound();
    }

    lastCount = snap.size;

    orders = snap.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    render();
  });

}

// 🔔 صوت
function sound(){
  new Audio("https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3").play();
}

// 🔔 إشعار
function notify(){
  if(Notification.permission==="granted"){
    new Notification("طلب جديد 🛒");
  }
}
Notification.requestPermission();

// 🎯 render
function render(){

  let search = document.getElementById("search").value.toLowerCase();
  let date = document.getElementById("dateFilter").value;

  let html="";
  let count=0;

  orders.forEach(o=>{

    if(search &&
      !o.customerName?.toLowerCase().includes(search) &&
      !o.phone?.includes(search)
    ) return;

    let d = o.createdAt?.toDate?.();

    if(date && d){
      if(d.toDateString() !== new Date(date).toDateString()) return;
    }

    count++;

    let status = o.status || "new";

    let msg = `DAHAP\n${o.orderID}\n${o.customerName}`;

    html += `
    <div class="card">

      <b>🧾 ${o.orderID}</b>
      <span class="status ${status}">${status}</span><br><br>

      👤 ${o.customerName}<br>
      📞 ${o.phone}<br>

      📍 ${o.gov || ""} - ${o.city || ""}<br>

      💎 ${o.chainName || ""} - ${o.design || ""}<br>

      🕒 ${d ? d.toLocaleString('ar-EG') : ""}<br><br>

      <a class="btn whatsapp" target="_blank"
      href="https://wa.me/${o.phone}?text=${encodeURIComponent(msg)}">WhatsApp</a>

      <button class="btn copy" onclick='copyText(${JSON.stringify(msg)})'>Copy</button>

      <button class="btn print" onclick='pdf(${JSON.stringify(o)})'>PDF</button>

      <button class="btn ship" onclick="update('${o.id}','shipped')">شحن</button>

      <button class="btn doneBtn" onclick="update('${o.id}','done')">تم</button>

    </div>
    `;
  });

  document.getElementById("orders").innerHTML=html;
  document.getElementById("count").innerText="📊 "+count;
}

// 📋 copy
window.copyText = (t)=>{
  navigator.clipboard.writeText(t);
}

// 🧾 PDF
window.pdf = (o)=>{
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();

  doc.text(`Order: ${o.orderID}`,10,10);
  doc.text(`Name: ${o.customerName}`,10,20);
  doc.text(`Phone: ${o.phone}`,10,30);

  doc.save(`${o.orderID}.pdf`);
}

// 🔄 update status
window.update = async (id,status)=>{
  await updateDoc(doc(db,"orders",id),{status});
}

// 🔍 live
document.getElementById("search").addEventListener("input",render);
document.getElementById("dateFilter").addEventListener("change",render);

</script>

</body>
</html>
