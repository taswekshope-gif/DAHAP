<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لوحة الطلبات</title>

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }
.card {
  background:#fff;
  border-radius:10px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
.btn {
  display:inline-block;
  padding:8px 12px;
  background:#25D366;
  color:#fff;
  border-radius:6px;
  text-decoration:none;
  margin-top:10px;
}
</style>

</head>
<body>

<h2>📦 لوحة الطلبات</h2>
<h3 id="todayCount">جاري الحساب...</h3>

<div id="orders"></div>

<script type="module">

// 🔥 Firebase
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 🔑 بياناتك
const firebaseConfig = {
  apiKey: "AIzaSyCitT_L8jC3J-z-zPn4ciOao2YJRoIvnsg",
  authDomain: "dahap-87e3a.firebaseapp.com",
  projectId: "dahap-87e3a",
  storageBucket: "dahap-87e3a.firebasestorage.app",
  messagingSenderId: "914606801645",
  appId: "1:914606801645:web:273f6dab0028a42bef02e4",
  measurementId: "G-ZW99YCTSGY"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);


// ==========================
// 🔐 حماية الصفحة
// ==========================
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    loadOrders(); // ✅ يبدأ تحميل الطلبات بعد تسجيل الدخول فقط
  }
});


// ==========================
// 📦 تحميل الطلبات
// ==========================
function loadOrders(){

  const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));

  let firstLoad = true;

  onSnapshot(q, (snapshot) => {

    let html = "";
    let today = new Date();
    today.setHours(0,0,0,0);

    let count = 0;

    snapshot.forEach(doc => {
      let d = doc.data();

      // 📊 حساب اليوم
      if (d.createdAt.toDate() >= today) {
        count++;
      }

      // 📱 رسالة واتساب جاهزة
      let message = `طلب رقم: ${d.orderID}
الاسم: ${d.customerName}`;

      html += `
      <div class="card">
        <b>🧾 كود:</b> ${d.orderID} <br>
        <b>👤 اسم:</b> ${d.customerName} <br>
        <b>📞 هاتف:</b> ${d.phone} <br>
        <b>📍 عنوان:</b> ${d.gov} - ${d.city} <br>
        ${d.address} <br>

        <a class="btn" href="https://wa.me/${d.phone}?text=${encodeURIComponent(message)}" target="_blank">
          📱 واتساب
        </a>
      </div>
      `;
    });

    document.getElementById("orders").innerHTML = html;
    document.getElementById("todayCount").innerHTML = `📊 طلبات اليوم: ${count}`;

    // 🔔 إشعار طلب جديد
    if (!firstLoad) {
      showNotification("🚨 طلب جديد وصل!");
    }
    firstLoad = false;

  });
}


// ==========================
// 🔔 إشعار شيك بدل alert
// ==========================
function showNotification(text){
  let div = document.createElement("div");
  div.innerHTML = text;
  div.style.position = "fixed";
  div.style.bottom = "20px";
  div.style.left = "20px";
  div.style.background = "#0F7B65";
  div.style.color = "#fff";
  div.style.padding = "10px 15px";
  div.style.borderRadius = "8px";
  div.style.zIndex = "9999";

  document.body.appendChild(div);

  setTimeout(()=> div.remove(), 3000);
}

</script>

</body>
</html>
