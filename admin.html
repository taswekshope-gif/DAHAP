<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>DAHAP Dashboard Pro</title>

<style>
body{
  font-family: Cairo, sans-serif;
  background:#f4f6f9;
  padding:20px;
}

.header{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  transition:0.2s;
}
.card:hover{transform:scale(1.01)}

.btn{
  padding:6px 10px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  margin:3px;
  font-size:13px;
}

.whatsapp{background:#25D366;color:#fff;}
.copy{background:#333;color:#fff;}
.print{background:#ff9800;color:#fff;}
.ship{background:#0F7B65;color:#fff;}
.doneBtn{background:#1976d2;color:#fff;}
  
.status{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  color:#fff;
}

 .newCard{
  border-right:5px solid orange;
}
.new{background:orange;}
.done{background:green;}
.shipped{background:#1976d2;}
</style>

</head>

<body>

<h2>📦 DAHAP Dashboard Pro</h2>

<div class="header">
  <input type="text" id="search" placeholder="🔍 بحث">
  <input type="date" id="dateFilter">
  <h3 id="count"></h3>
</div>

<button onclick="printSelected()" style="margin-bottom:15px;">
🖨️ طباعة المحدد
</button>
  
<div id="orders"></div>
  
<div id="liveStatus" style="color:green;margin-bottom:10px;">
🟢 Live Connected
</div>
  
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  
const firebaseConfig = {
  apiKey: "AIzaSyCitT_L8jC3J-z-zPn4ciOao2YJRoIvnsg",
  authDomain: "dahap-87e3a.firebaseapp.com",
  projectId: "dahap-87e3a",
  storageBucket: "dahap-87e3a.firebasestorage.app",
  messagingSenderId: "914606801645",
  appId: "1:914606801645:web:273f6dab0028a42bef02e4",
  measurementId: "G-ZW99YCTSGY"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let orders = [];
let lastCount = 0;

// 🔐 login
  
let authReady = false;

// 🔐 انتظار Firebase بدون طرد غلط
let loaded = false;

onAuthStateChanged(auth, (user) => {
  if (user) {
    load();
  } else {
    window.location.href = "login.html";
  }
});
  
// 📦 load orders
function load(){

  const q = query(collection(db,"orders"), orderBy("createdAt","desc"));

  onSnapshot(q,(snap)=>{document.getElementById("liveStatus").innerText = "🟢 Live Updating...";
setTimeout(()=>{
  document.getElementById("liveStatus").innerText = "🟢 Live Connected";
}, 1000);

    if(lastCount && snap.size > lastCount){
      notify();
      sound();
    }

    lastCount = snap.size;

    orders = snap.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    render();
  });

}
  
// 🔔 صوت
function sound(){
  new Audio("https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3").play();
}

// 🔔 إشعار
function notify(){
  if(Notification.permission==="granted"){
    new Notification("طلب جديد 🛒");
  }
}
Notification.requestPermission();

// 🎯 render
function render(){

  let totalOrders = orders.length;
  let newOrders = 0;
  let shippedOrders = 0;
  let doneOrders = 0;

  let search = document.getElementById("search").value.toLowerCase();
  let date = document.getElementById("dateFilter").value;

  let html="";
  let count=0;

  orders.forEach(o=>{

    if(search &&
      !o.customerName?.toLowerCase().includes(search) &&
      !o.phone?.includes(search)
    ) return;

    let d = o.createdAt?.toDate?.();

    if(date && d){
      if(d.toDateString() !== new Date(date).toDateString()) return;
    }
   let status = o.status || "new";
    
   if(status === "new") newOrders++;
   if(status === "shipped") shippedOrders++;
   if(status === "done") doneOrders++;
    
    count++;

  

 let msg = `DAHAP
كود الطلب: ${o.orderID || "-"}

--------------------
👤 اسم العميل: ${o.customerName || "-"}
📞 رقم الهاتف: ${o.phone || "-"}

📍 العنوان:
${o.gov || "-"} - ${o.city || "-"}
${o.address || "-"}

💎 تفاصيل السلسلة:
الاسم على السلسلة: ${o.chainName || "-"}
نوع الكتابة: ${o.font || "-"}
التصميم: ${o.design || "-"}

🕒 وقت الطلب:
${o.createdAt?.toDate?.().toLocaleString('ar-EG') || "-"}
`;

html += `
<div class="card">
<div class="card ${status === 'new' ? 'newCard' : ''}">
<input type="checkbox" class="selectOrder"
value='${btoa(unescape(encodeURIComponent(JSON.stringify(o))))}'
style="float:left; transform:scale(1.2); margin-left:10px;">

<b>🧾 ${o.orderID}</b>
<span class="status ${status}">${status}</span><br><br>

👤 ${o.customerName || "غير محدد"} <br>
📞 ${o.phone || "غير محدد"} <br>

📍 ${o.gov || "غير محدد"} - ${o.city || "غير محدد"} <br>
${o.address || ""} <br><br>

💎 <b>تفاصيل الطلب:</b><br>
الاسم: ${o.chainName || "-"} <br>
الكتابة: ${o.font || "-"} <br>
التصميم: ${o.design || "-"} <br><br>

🕒 ${o.createdAt?.toDate?.().toLocaleString('ar-EG') || ""} <br><br>

<a class="btn whatsapp" target="_blank"
href="https://wa.me/${o.phone}">واتساب</a>

<button class="btn copy" onclick='copyText(${JSON.stringify(msg)})'>نسخ</button>

<button class="btn ship" onclick="update('${o.id}','shipped')">شحن</button>

<button class="btn" onclick="update('${o.id}','new')">New</button>

<button class="btn doneBtn" onclick="update('${o.id}','done')">تم</button>

</div>
`;
  });

 document.getElementById("count").innerHTML = `
📊 Total: ${totalOrders} |
🆕 New: ${newOrders} |
🚚 Shipped: ${shippedOrders} |
✅ Done: ${doneOrders}
`;
}

// 📋 copy
window.copyText = (t)=>{
  navigator.clipboard.writeText(decodeURIComponent(t));
}

// 🖨️ PRINT ONLY (NO PDF)
window.printSelected = () => {

  let selected = document.querySelectorAll(".selectOrder:checked");

  if(selected.length === 0){
    alert("اختار أوردرات الأول");
    return;
  }

  let win = window.open('', '', 'width=900,height=700');

  let html = `
<html>
<head>
<meta charset="UTF-8">
<style>

body{
  margin:0;
  font-family: Arial;
}

/* A4 GRID 4 INVOICES */
.page{
  width:210mm;
  min-height:297mm;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:5mm;
  padding:5mm;
  box-sizing:border-box;
}

.invoice{
  border:1px solid #000;
  padding:10px;
  font-size:11px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  font-weight:bold;
}

.content{
  margin-top:8px;
  line-height:1.4;
}

.centerMsg{
  text-align:center;
  font-size:11px;
  margin-top:10px;
}

hr{margin:5px 0;}

</style>
</head>

<body>

<div class="page">
`;

  selected.forEach(el => {

    let o = JSON.parse(decodeURIComponent(atob(el.value)));

    html += `
    <div class="invoice">

      <div class="header">
        <div>DAHAP</div>
        <div>${new Date(o.createdAt?.toDate?.() || Date.now()).toLocaleString()}</div>
      </div>

      <hr>

      <div class="content">
        <b>ID:</b> ${o.orderID || "-"} <br>
        <b>Name:</b> ${o.customerName || "-"} <br>
        <b>Phone:</b> ${o.phone || "-"} <br>

        <br>

        <b>Address:</b><br>
        ${o.gov || "-"} - ${o.city || "-"}<br>
        ${o.address || "-"}
      </div>

      <div class="centerMsg">
        <b>✨ Thank you for choosing DAHAP 💛</b><br>
        We appreciate your trust 😊
      </div>

    </div>
    `;
  });

html += `
</div>

<script>
window.onload = function(){
  window.print();
};
<\/script>

</body>
</html>
`;

win.document.write(html);
win.document.close();
};
</script>

</body>
</html>
